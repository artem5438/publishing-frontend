name: Deploy Frontend To GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate static media for Pages
        run: |
          if ! compgen -G "public/publishing-media/*.jpg" > /dev/null; then
            echo "::error::Missing public/publishing-media/*.jpg — add mock media files before deploy."
            exit 1
          fi
          echo "Static media OK ($(ls public/publishing-media | wc -l | tr -d ' ') files)"

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_APP_PROFILE: pages-guest
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/publishing-media

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
