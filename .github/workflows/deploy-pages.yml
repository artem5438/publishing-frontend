name: Deploy Frontend To GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate MinIO media secret
        env:
          VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}
        run: |
          if [ -z "${VITE_MEDIA_BASE_URL}" ]; then
            echo "::error::Missing repository secret VITE_MEDIA_BASE_URL. See docs/GITHUB_PAGES_MINIO.md"
            exit 1
          fi
          case "${VITE_MEDIA_BASE_URL}" in
            https://*) ;;
            *)
              echo "::error::VITE_MEDIA_BASE_URL must start with https:// (GitHub Pages is HTTPS). Got: ${VITE_MEDIA_BASE_URL}"
              exit 1
              ;;
          esac
          case "${VITE_MEDIA_BASE_URL}" in
            */publishing-media) ;;
            *)
              echo "::error::VITE_MEDIA_BASE_URL must end with /publishing-media. Got: ${VITE_MEDIA_BASE_URL}"
              exit 1
              ;;
          esac
          echo "VITE_MEDIA_BASE_URL is set (HTTPS, publishing-media path OK)"

      - name: Build for GitHub Pages
        run: npm run build:pages
        env:
          VITE_APP_PROFILE: pages-guest
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_MEDIA_BASE_URL: ${{ secrets.VITE_MEDIA_BASE_URL }}

      - name: Add SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll for GitHub Pages
        run: touch dist/.nojekyll

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
